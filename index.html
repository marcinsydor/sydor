<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Marcin Sydor — software developer working across web, mobile and Smart TV.">
  <meta name="theme-color" content="#f6f5f2">
  <title>Marcin Sydor — Software Developer</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211d;
      --muted: #5b6761;
      --paper: #f6f5f2;
      --line: #d9ddd7;
      --accent: #246b50;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    .wrap { width: min(100% - 40px, 1080px); margin-inline: auto; }
    header { height: 88px; display: flex; align-items: center; border-bottom: 1px solid var(--line); }
    .brand { font-size: 15px; font-weight: 700; letter-spacing: -.03em; }
    main { padding: clamp(82px, 15vw, 164px) 0 110px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--accent); font: 600 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #55a579; box-shadow: 0 0 0 4px #55a57920; }
    h1 { max-width: 790px; margin: 28px 0 24px; font-size: clamp(48px, 8.2vw, 92px); line-height: .98; letter-spacing: -.075em; font-weight: 600; }
    h1 span { color: var(--accent); }
    .intro { max-width: 590px; margin: 0; color: var(--muted); font-size: clamp(18px, 2.4vw, 21px); line-height: 1.65; }
    .rule { height: 1px; margin: 76px 0 24px; background: var(--line); }
    footer { padding: 22px 0 34px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    footer .wrap { display: flex; justify-content: space-between; gap: 16px; }
    @media (max-width: 560px) {
      .wrap { width: min(100% - 32px, 1080px); }
      header { height: 72px; }
      main { padding-top: 94px; padding-bottom: 80px; }
      footer .wrap { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="brand">SYDOR<span aria-hidden="true">.</span></div>
  </header>
  <main class="wrap">
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span> Software Developer</div>
    <h1>Thoughtful software.<br><span>Useful by design.</span></h1>
    <p class="intro">I’m Marcin Sydor, a software developer working across web, mobile and Smart TV. I’m interested in building focused products that solve real problems.</p>
    <div class="rule"></div>
  </main>
  <footer><div class="wrap"><span>© <span id="year"></span> Marcin Sydor</span><span>Built with care.</span></div></footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
